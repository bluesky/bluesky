name: Update lockfile

on:
  workflow_dispatch:
  schedule:
    # Run weekly so dependency updates arrive in their own pull request
    - cron: "0 6 * * MON"

permissions:
  contents: write
  pull-requests: write

jobs:
  pixi-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need this to get version number from last tag
          fetch-depth: 0

      - name: Fetch tags
        uses: ./.github/actions/fetch_tags

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          run-install: false

      - name: Update lockfile
        run: |
          set -o pipefail
          pixi update --json | pixi exec pixi-diff-to-markdown >> diff.md

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "BLD: update pixi lockfile"
          title: "BLD: update pixi lockfile"
          body-path: diff.md
          branch: update-pixi-lockfile
          base: main
          add-paths: pixi.lock
          delete-branch: true
