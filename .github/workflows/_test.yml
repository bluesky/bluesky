on:
  workflow_call:
    inputs:
      python-version:
        type: string
        description: The version of python to install
        required: true
      runs-on:
        type: string
        description: The runner to run this job on
        required: true
      full-suite:
        type: boolean
        description: >-
          Also run the RE fixture's call_returns_result=False variant
          (roughly doubles the RE-based tests).
        required: false
        default: false
    secrets:
      CODECOV_TOKEN:
        required: true

env:
  # https://github.com/pytest-dev/pytest/issues/2042
  PY_IGNORE_IMPORTMISMATCH: "1"

jobs:
  run:
    runs-on: ${{ inputs.runs-on }}
    # A healthy run of this suite takes 11-17 minutes, and sigint tests can
    # hang pytest if they fail, so use a runner timeout rather than use pytest timeout
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need this to get version number from last tag
          fetch-depth: 0

      - name: Fetch tags
        uses: ./.github/actions/fetch_tags

      - name: Set pixi environment name
        id: set-pixi-env
        # "min" is the lowest-versions environment; other values are Python versions
        run: |
          if [ "$PYTHON_VERSION" = "min" ]; then
            echo "pyenv=min" >> $GITHUB_OUTPUT
          else
            echo "pyenv=py${PYTHON_VERSION//./}" >> $GITHUB_OUTPUT
          fi
        shell: bash
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          locked: true
          environments: ${{ steps.set-pixi-env.outputs.pyenv }}

      - name: Run tests
        run: pixi run --locked -e ${{ steps.set-pixi-env.outputs.pyenv }} tests -o faulthandler_timeout=300 ${{ inputs.full-suite && '--include-call-returns-result-false' || '' }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          name: ${{ inputs.python-version }}/${{ inputs.runs-on }}
          files: cov.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
