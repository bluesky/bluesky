name: CI

on:
  push:
  pull_request:

jobs:
  check:
    uses: ./.github/workflows/_check.yml

  lint:
    needs: check
    if: needs.check.outputs.branch-pr == ''
    uses: ./.github/workflows/_tox.yml
    with:
      tox: pre-commit,type-checking

  test:
    needs: check
    if: needs.check.outputs.branch-pr == ''
    strategy:
      matrix:
        runs-on: ["ubuntu-latest", "windows-latest"] # can add macos-latest
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # duckdb (tiled dep) has no Windows wheels for 3.14 yet
          - runs-on: "windows-latest"
            python-version: "3.14"
        include:
          # Include one that runs in the dev environment. This job also runs
          # the full suite (the RE call_returns_result=False variant) so that
          # branch is exercised at least once per CI run.
          - runs-on: "ubuntu-latest"
            python-version: "dev"
            full-suite: true
      fail-fast: false
    uses: ./.github/workflows/_test.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      python-version: ${{ matrix.python-version }}
      full-suite: ${{ matrix.full-suite || false }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docs:
    needs: check
    if: needs.check.outputs.branch-pr == ''
    uses: ./.github/workflows/_docs.yml

  dist:
    needs: check
    if: needs.check.outputs.branch-pr == ''
    uses: ./.github/workflows/_dist.yml

  pypi:
    if: github.ref_type == 'tag'
    needs: dist
    uses: ./.github/workflows/_pypi.yml
    permissions:
      id-token: write

  release:
    if: github.ref_type == 'tag'
    needs: [dist, docs]
    uses: ./.github/workflows/_release.yml
    permissions:
      contents: write
