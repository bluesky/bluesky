on:
  workflow_call:
    inputs:
      task:
        type: string
        description: Which pixi task to run
        required: true
      environment:
        type: string
        description: Which pixi environment to use (defaults to "default")
        required: false
        default: "default"


jobs:
  run:
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need this to get version number from last tag
          fetch-depth: 0

      - name: Fetch tags
        uses: ./.github/actions/fetch_tags

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          locked: true
          environments: ${{ inputs.environment }}

      - name: Run ${{ inputs.task }} with pixi
        run: pixi run --locked -e ${{ inputs.environment }} ${{ inputs.task }}
