name: Install requirements
description: Install a version of python then call pip install and report what was installed
inputs:
  python-version:
    description: Python version to install, default is from Dockerfile
    default: "dev"
  pip-install:
    description: Parameters to pass to pip install
    default: "$([ -f dev-requirements.txt ] && echo '-c dev-requirements.txt') -e .[dev]"

runs:
  using: composite
  steps:
    - name: Fetch tags from upstream if this checkout has none
      run: |
        # GitHub does not copy tags into a fork, so setuptools-scm computes
        # bluesky==0.1.devN there, which conflicts with ophyd-async requiring
        # bluesky>=1.13.1rc2. Fetch tags from upstream here, which is a no-op
        # for upstream and for any checkout that already has them.
        if [ -z "$(git tag)" ]; then
          git remote add upstream https://github.com/bluesky/bluesky.git 2>/dev/null || true
          git fetch --quiet --tags --no-recurse-submodules upstream
          echo "No tags in this checkout; fetched $(git tag | wc -l) from upstream."
        fi
      shell: bash

    - name: Get version of python
      run: |
        PYTHON_VERSION="${{ inputs.python-version }}"
        if [ $PYTHON_VERSION == "dev" ]; then
          PYTHON_VERSION=$(sed -n "s/ARG PYTHON_VERSION=//p" Dockerfile)
        fi
        echo "PYTHON_VERSION=$PYTHON_VERSION" >> "$GITHUB_ENV"
      shell: bash

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install packages
      run: pip install ${{ inputs.pip-install }}
      shell: bash

    - name: Report what was installed
      run: pip freeze
      shell: bash
