[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "bluesky"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
description = "Experiment specification & orchestration."
dependencies = [
    "cycler>=0.11.0",
    "event-model>=1.24.0",
    "historydict>=1.2.6",
    "msgpack>=1.0.3",
    "msgpack-numpy>=0.4.8",
    "numpy>=1.22.0",
    "opentelemetry-api>=1.16.0",
    "toolz>=0.11.2",
    "tqdm>=4.44",
    "typing-extensions>=4.10.0",
]
dynamic = ["version"]
license.file = "LICENSE"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "attrs>=22.2.0",
    "bluesky-tiled-plugins>=2.0.0",
    "cloudpickle>=3.0.0",
    "copier>=6.0.0",
    "coverage>=6.0.1",
    "databroker>=1.2.4",
    "doct>=1.1.0",
    "doctr>=1.9.0",
    "flake8>=4.0.0",
    "ipython>=7.16.2",
    "ipywidgets>=7.6.6",
    "jinja2>=3.1.1",
    "lmfit>=1.1.0",
    "matplotlib>=3.5.0",
    "mongoquery>=1.4.0",
    "mongomock>=4.0.0",
    "multiprocess>=0.70.13",
    "mypy>=0.920",
    "myst-parser>=0.16.0",
    "networkx>=2.7",
    "numpydoc>=1.2",
    "opentelemetry-sdk>=1.16.0",
    "ophyd>=1.6.3",
    "ophyd-async>=0.13.5 ; python_full_version >= '3.11'", # for async suspenders
    "orjson>=3.6.5",
    "packaging>=21.3",
    "pandas>=2.0.0",
    "pickleshare>=0.7.5",
    "pipdeptree>=2.2.0",
    "pre-commit>=2.16.0",
    "pydata-sphinx-theme>=0.12",
    "pyepics>=3.5.2",
    "pyqt5>=5.15.5",
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-faulthandler>=2.0.1",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0",
    "pyzmq>=23.0.0",
    "requests>=2.27.0",
    "ruff>=0.0.17",
    "scikit-image>=0.19.0",
    "scipy>=1.7.2",
    "sphinx>=4.2.0,<7.3",
    "sphinx-autobuild>=2024.2.4",
    "sphinx-copybutton>=0.5.0",
    "sphinx-design>=0.0.13",
    "sphinxcontrib-mermaid>=0.8",
    "sphinx-rtd-theme>=1.1.0",
    "streamz>=0.6.3",
    # These suitcases are test deps of databroker which we need to access
    # databroker fixtures.
    "suitcase-jsonl>=0.2.2",
    "suitcase-mongo>=0.3.1",
    "suitcase-msgpack>=0.3.0",
    "tifffile>=2021.10.10",
    "tiled[server]>=0.2.0",
    "types-mock>=4.0.2",
    "vendoring>=1.1.0",
    "zict>=2.1.0",
    "pytest-mock>=3.15.1",
]
ipython = [
    "ipython>=7.16.2",
]
zmq = [
    "pyzmq>=23.0.0",
]
common = [
    "ophyd>=1.6.3",
    "databroker>=1.2.4",
]
tools = [
    "doct>=1.1.0",
    "lmfit>=1.1.0",
    "tifffile>=2021.10.10",
    "historydict>=1.2.6",
]
streamz = [
    "streamz>=0.6.3",
]
plotting = [
    "matplotlib>=3.5.0",
]
cmd = [
    "colorama>=0.4.5",
]
olog = [
    "jinja2>=3.1.1",
]
old_persistentdict = [
    "zict>=2.1.0,<3",
]
all = ["bluesky[dev,ipython,zmq,common,tools,streamz,plotting,cmd,olog]"]

[project.scripts]
bluesky-0MQ-proxy = "bluesky.commandline.zmq_proxy:main"

[project.urls]
GitHub = "https://github.com/bluesky/bluesky"

[[project.authors]] # Further authors may be added by duplicating this section
name = "danielballan"


[tool.setuptools_scm]
version_file = "src/bluesky/_version.py"

[tool.mypy]
ignore_missing_imports = true # Ignore missing stubs in imported modules
exclude = ["src/bluesky/_vendor/"]

[tool.pytest.ini_options]
# Run pytest with all our checkers, and don't spam us with massive tracebacks on error
# Don't collect the interactive directory which is intended for manual execution
addopts = """
    --tb=native --doctest-modules --doctest-glob="*.rst" --ignore src/bluesky/tests/interactive
    """
# https://iscinumpy.gitlab.io/post/bound-version-constraints/#watch-for-warnings
filterwarnings = [
    "error",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
# Doctest python code in docs, python code in src docstrings, test functions in tests
testpaths = "src/bluesky/tests"

[tool.coverage.run]
data_file = "/tmp/bluesky.coverage"

[tool.coverage.report]
exclude_lines = ["if __name__ == '__main__':"]

[tool.coverage.paths]
# Tests are run from installed location, map back to the src directory
source = ["src", "**/site-packages/"]

[tool.ruff]
src = ["src", "tests"]
line-length = 115
exclude = [
    "docs/source/conf.py",
    "docs/source/examples",
    "src/bluesky/_vendor"
]


[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear - https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "C4",  # flake8-comprehensions - https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    "E",   # pycodestyle errors - https://docs.astral.sh/ruff/rules/#error-e
    "F",   # pyflakes rules - https://docs.astral.sh/ruff/rules/#pyflakes-f
    "W",   # pycodestyle warnings - https://docs.astral.sh/ruff/rules/#warning-w
    "I",   # isort - https://docs.astral.sh/ruff/rules/#isort-i
    "UP",  # pyupgrade - https://docs.astral.sh/ruff/rules/#pyupgrade-up
]
ignore = [
    # UP031/UP032 only rewrite string formatting (%-format / str.format to
    # f-strings); enforcing them is pure code churn with no behavior change.
    "UP031", # %-format strings
    "UP032", # .format() -> f-string
    "B905",  # adding strict=False to every zip call is just noise
]

[tool.ruff.lint.per-file-ignores]
# By default, private member access is allowed in tests
# See https://github.com/DiamondLightSource/python-copier-template/issues/154
# Remove this line to forbid private member access in tests
"tests/**/*" = ["SLF001"]


[tool.vendoring]
destination = "src/bluesky/_vendor/"
requirements = "src/bluesky/_vendor/vendor.txt"
namespace = "bluesky._vendor"
protected-files = ["__init__.py", "README.rst", "vendor.txt"]

[tool.vendoring.license.fallback-urls]
super_state_machine = "https://github.com/beregond/super_state_machine/blob/master/LICENSE"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]
requires-pixi = ">=0.83.0"

[tool.pixi.dependencies]
python = "*"

[tool.pixi.pypi-dependencies]
bluesky = { path = ".", editable = true }

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.min.dependencies]
python = "3.10.*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
py310 = { features = ["py310", "dev"], solve-group = "py310" }
py311 = { features = ["py311", "dev"], solve-group = "py311" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }
py313 = { features = ["py313", "dev"], solve-group = "py313" }
py314 = { features = ["py314", "dev"], solve-group = "py314" }
min = { features = ["min", "dev", "ipython", "zmq", "common", "tools", "streamz", "plotting", "cmd", "olog"], solve-group = "min", solve-strategy = "lowest-direct" }

[tool.pixi.tasks]
lint = "pre-commit run --all-files --show-diff-on-failure"
type-checking = "mypy src"
tests = "pytest -n 2 --cov=bluesky --cov-report term --cov-report xml:cov.xml"
docs = "sphinx-build -EW --keep-going -T docs build/html"
linkcheck = "sphinx-build -b linkcheck -T docs build/linkcheck"
